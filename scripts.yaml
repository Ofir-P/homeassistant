doorbell_tv_popup_living_room:
  alias: Doorbell TV Popup - Living Room
  description: Shows the live doorbell video on the Living Room TV (PiPup). The "Open
    the door" button is added only when someone is in the living room (presence sensor)
    and at least one person is home; otherwise video only. Stops the doorbell stream
    after the popup ends.
  mode: restart
  icon: mdi:doorbell-video
  sequence:
  - condition: state
    entity_id: media_player.living_room_lg_webos_smart_tv
    state: 'on'
  - wait_template: '{{ is_state(''camera.doorbell'',''streaming'') }}'
    timeout:
      seconds: 10
    continue_on_timeout: true
  - alias: Show popup (unlock button only if someone is in the living room)
    if:
    - condition: state
      entity_id: binary_sensor.living_room_presence_sensor_presence
      state: 'on'
    - condition: numeric_state
      entity_id: zone.home
      above: 0
    then:
    - action: pipup.show
      target:
        entity_id: binary_sensor.living_room_tv_popup
      data:
        popup_id: doorbell
        title: "\U0001F514 Doorbell"
        message: Someone is at the door
        duration: '{{ states(''input_number.doorbell_tv_popup_seconds'') | int(15)
          }}'
        video_url: rtsp://10.0.0.150:8554/T8210P7422441C73
        media_width: 640
        muted: false
        live_badge: true
        dismiss_screensaver: true
        buttons:
        - id: unlock_main_door
          label: "\U0001F513 Open the door"
        position: top_left
      continue_on_error: true
    else:
    - action: pipup.show
      target:
        entity_id: binary_sensor.living_room_tv_popup
      data:
        popup_id: doorbell
        title: "\U0001F514 Doorbell"
        message: Someone is at the door
        duration: '{{ states(''input_number.doorbell_tv_popup_seconds'') | int(15)
          }}'
        video_url: rtsp://10.0.0.150:8554/T8210P7422441C73
        media_width: 640
        muted: false
        live_badge: true
        dismiss_screensaver: true
        position: top_left
      continue_on_error: true
  - delay:
      seconds: '{{ (states(''input_number.doorbell_tv_popup_seconds'') | int(15))
        + 30 }}'
  - if:
    - condition: state
      entity_id: camera.doorbell
      state: streaming
    then:
    - action: button.press
      target:
        entity_id: button.doorbell_stop_p2p_stream
      continue_on_error: true
