# Kitchen timer popup (tablet sidebar clock tap)
# Sets the timer on the Kitchen Echo Dot - same device as the Eggs Timer
action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Kitchen timer
    content:
      type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: state
              entity: timer.kitchen_timer
              state_not: idle
          card:
            type: entities
            entities:
              - entity: timer.kitchen_timer
                name: Running on Kitchen Echo Dot
                icon: mdi:timer-sand
        - type: grid
          columns: 4
          square: false
          cards:
            - type: custom:button-card
              name: 1 min
              show_icon: false
              tap_action:
                action: fire-dom-event
                browser_mod:
                  service: browser_mod.sequence
                  data:
                    sequence:
                      - service: script.kitchen_timer_set
                        data:
                          minutes: 1
                      - service: browser_mod.close_popup
              styles:
                card: [height: 64px, border-radius: 14px, background: "rgba(255,255,255,0.06)"]
                name: [font-size: 18px, font-weight: 600]
            - type: custom:button-card
              name: 3 min
              show_icon: false
