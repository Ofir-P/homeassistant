# Lights-on popup (tablet sidebar "Lights on" line)
# Each light only shows while it's on. Tap a row to turn it off, hold for details.
action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Lights on
    content:
      type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - condition: state
              entity: light.dining_table_l2
              state: "on"
          card:
            type: custom:mushroom-template-card
            entity: light.dining_table_l2
            primary: "Living Room"
            secondary: "Above Couch"
            icon: mdi:lightbulb-on
            icon_color: amber
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            card_mod:
              style: |
                ha-card { background: rgba(255,255,255,0.04) !important; border: none !important; box-shadow: none !important; }
        - type: conditional
          conditions:
            - condition: state
              entity: light.living_room_l2
              state: "on"
          card:
            type: custom:mushroom-template-card
