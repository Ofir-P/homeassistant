              grid: [grid-template-areas: '"i n"', grid-template-columns: "24px auto", grid-template-rows: "100%", height: 100%, justify-content: center, align-content: center, align-items: center, column-gap: 10px]
              img_cell: [width: 24px, height: 24px]
              icon: [width: 24px, height: 24px, "--mdc-icon-size": 24px, color: "#ffc107"]
              name: [color: "#ffc107", font-weight: 600, font-size: 16px]
