action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Spotify
    card_mod:
      style:
        #popup header
        .:
    content:
      type: vertical-stack
      cards:
        - square: false
          columns: 1
          type: grid
          cards:
            - type: vertical-stack
              cards:
                - content: >
                    # <img width="30" height="30" src='/local/Logos/spotify.png'
                    style='vertical-align:middle' /> Spotify
                  style:
                    .: |
                      ha-card {
                        background-color: transparent !important;
                        box-shadow: none !important;
                      }
                    ha-markdown:
                      $: |
                        h1 {
                          font-size: 25px;
                        # font-weight: bold;
                          text-align: center;
                          letter-spacing: '-0.01em';
                        }
                  type: markdown
                # Now playing: artwork, track info, prev/play/next, shuffle, repeat and volume
                - type: custom:mini-media-player
                  entity: media_player.spotify_elian_sarfaty
                  name: Now Playing
                  artwork: cover
                  info: scroll
                  hide:
                    power: true
                    source: true
                    shuffle: false
                    repeat: false
                    progress: false
                    volume: false
                # Device picker + playlist grid (replaces the old spotify-card, which no longer works with Spotcast v6)
                - type: entities
                  entities:
                    - entity: input_select.spotify_play_on
                      name: Play on
                      icon: mdi:speaker
                - type: grid
                  columns: 5
                  square: false
                  cards:
                    - type: custom:button-card
                      name: "Mini Wedding 1"
                      show_icon: false
                      show_entity_picture: true
                      entity_picture: "https://mosaic.scdn.co/300/ab67616d00001e020aa18e80cce01cc9b7c72ed5ab67616d00001e024d8af36fe2c8606ec59df04aab67616d00001e02508b835b5dd68662ec44646aab67616d00001e0266a74de4b48539c8153b8ea1"
                      tap_action:
                        action: perform-action
                        perform_action: script.spotify_play_playlist
                        data:
                          uri: "spotify:playlist:7dckM4o4SMNuAsUXj6yqgB"
                      styles:
                        card: [padding: 4px, background: transparent, box-shadow: none]
                        grid: [grid-template-areas: '"i" "n"']
                        entity_picture: [width: 100%, border-radius: 6px, aspect-ratio: 1/1, object-fit: cover]
                        name: [font-size: 11px, white-space: nowrap, overflow: hidden, text-overflow: ellipsis, width: 100%, padding-top: 4px]
