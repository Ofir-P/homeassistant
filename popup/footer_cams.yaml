action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Cams
    card_mod:
      style:
        #popup header
        .:
    content:
      type: vertical-stack
      cards:
        - square: false
          columns: 1
          type: grid
          cards:
            - type: custom:webrtc-camera
              entity: camera.living_room_sub
              title: Balcony
              muted: true
              ui: true
              intersection: 0
            - type: custom:webrtc-camera
              entity: camera.dining_table_sub
              title: Main Door
              muted: true
              ui: true
              intersection: 0
            - camera_view: auto
              type: picture-glance
              entities: []
              camera_image: camera.parking_parking
              aspect_ratio: "20:15"
            - camera_view: auto
              type: picture-glance
              entities: []
              camera_image: camera.doorbell
              aspect_ratio: "20:15"
            - type: custom:webrtc-camera
              entity: camera.aquarium_sub
              title: Office
              muted: true
              ui: true
              intersection: 0
