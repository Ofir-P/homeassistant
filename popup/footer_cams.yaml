action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Cams
    dismiss_action:
      service: button.press
      data:
        entity_id: button.doorbell_stop_p2p_stream
    card_mod:
      style:
        #popup header
        .:
    content:
      type: vertical-stack
      cards:
        - square: false
          columns: 1
          type: grid
          cards:
            - type: custom:webrtc-camera
              entity: camera.living_room_sub
              title: Balcony
              muted: true
              ui: true
              intersection: 0
            - type: custom:webrtc-camera
              entity: camera.dining_table_sub
              title: Main Door
              muted: true
              ui: true
              intersection: 0
            - camera_view: auto
              type: picture-glance
              entities: []
              camera_image: camera.parking_parking
              aspect_ratio: "20:15"
            - type: vertical-stack
              cards:
                - type: conditional
                  conditions:
                    - condition: state
                      entity: camera.doorbell
                      state_not: streaming
                  card:
                    type: picture-glance
                    title: Doorbell - tap for live
                    camera_image: camera.doorbell
                    camera_view: auto
                    aspect_ratio: "20:15"
                    entities: []
                    tap_action:
                      action: perform-action
                      perform_action: button.press
                      target:
                        entity_id: button.doorbell_start_p2p_stream
                - type: conditional
                  conditions:
                    - condition: state
                      entity: camera.doorbell
                      state: streaming
                  card:
                    type: custom:webrtc-camera
                    entity: camera.doorbell
                    mode: webrtc
                    muted: true
                    style: ".mode {display: none !important} .status {display: none !important}"
            - type: custom:webrtc-camera
              entity: camera.aquarium_sub
              title: Office
              muted: true
              ui: true
              intersection: 0
